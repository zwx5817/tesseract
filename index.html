<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesseract MC Server</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
body{
  min-height:100vh;
  background:#18181b;
  color:#eee;
  padding:24px 16px;
}
.container{
  max-width:900px;
  margin:0 auto;
}
.lang-wrap{
  text-align:right;
  margin-bottom:24px;
}
.lang-btn{
  padding:8px 14px;
  background:#27272a;
  color:#fff;
  border:1px solid #3f3f46;
  border-radius:6px;
  cursor:pointer;
}
.card{
  background:#27272a;
  border-radius:10px;
  padding:20px;
  margin-bottom:16px;
  border:1px solid #3f3f46;
  transition: transform 0.22s ease, box-shadow 0.22s ease;
}
.card:hover{
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.server-row{
  margin-bottom:14px;
}
.status-dot{
  display:inline-block;
  width:12px;height:12px;
  border-radius:50%;
  margin-right:6px;
}
.dot-green{background:#22c55e;}
.dot-red{background:#ef4444;}
.dot-gray{background:#71717a;}
.btn{
  padding:7px 12px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  margin-top:8px;
}
.btn-primary{
  background:#3b82f6;
  color:white;
}
.btn-primary:disabled{
  opacity:0.45;
  cursor:not-allowed;
}
.footer-text{
  text-align:center;
  margin-top:40px;
  color:#a1a1aa;
  font-size:14px;
}
/* Modal */
.modal-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:999;
}
.modal-box{
  width:100%;
  max-width:620px;
  max-height:85vh;
  background:#27272a;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  border-bottom:1px solid #3f3f46;
}
.modal-close{
  background:transparent;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}
.modal-body{
  padding:16px 18px;
  overflow-y:auto;
  flex:1;
}
.search-wrap{
  position:relative;
  margin-bottom:14px;
}
.search-input{
  width:100%;
  padding:9px 34px 9px 12px;
  border-radius:6px;
  border:1px solid #444;
  background:#1f1f23;
  color:#fff;
  font-size:15px;
}
.search-clear{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:transparent;
  border:none;
  color:#aaa;
  font-size:18px;
  cursor:pointer;
}
.player-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
  gap:8px;
}
.player-item{
  padding:6px 8px;
  background:#323238;
  border-radius:4px;
  font-size:14px;
}
.pagination{
  display:flex;
  gap:10px;
  margin-top:16px;
  justify-content:center;
}
.pagination button{
  padding:6px 12px;
  border-radius:4px;
  border:none;
  background:#3b82f6;
  color:#fff;
  cursor:pointer;
}
.pagination button:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.hidden{display:none;}
.qq-link{
  display:inline-block;
  margin:10px 0;
  padding:10px 18px;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  border-radius:8px;
  transition:transform 0.2s ease;
}
.qq-link:hover{transform:translateY(-4px);}
.rule-title{
  font-size:18px;
  margin:12px 0 8px;
}
.rule-list{
  padding-left:1.2rem;
  line-height:1.7;
}
.hot-tip{
  color:#facc15;
  margin:8px 0;
}
</style>
</head>
<body>
<div class="container">
  <div class="lang-wrap">
    <button class="lang-btn" id="toggleLang">Switch to English</button>
  </div>

  <h1 id="title">Tesseract MC服务器</h1>
  <p id="intro" style="margin:8px 0 12px;">欢迎来到Tesseract服务器，请加入QQ审核群进入服务器</p>
  <div class="hot-tip" id="hotTip">热知识：服务器可以用矿透</div>

  <a class="qq-link" id="qqBtn" href="https://qm.qq.com/q/Ge9hOklVeu" target="_blank">戳我直达QQ审核群 ↗</a>

  <div class="card">
    <h3 class="rule-title" id="ruleHead">📜 服务器规则</h3>
    <ul class="rule-list" id="ruleContent">
      <li>禁止恶意破坏他人建筑、生电机器</li>
      <li>禁止恶意卡服、压测服务器</li>
      <li>禁止恶意骚扰其他玩家</li>
      <li>加入服务器需要通过QQ审核群审核</li>
    </ul>
  </div>

  <div class="card">
    <h3 id="mainServerTitle">主服 hmfree.tooo.top:20049</h3>
    <div class="server-row">
      <span class="status-dot dot-gray" id="mainDot"></span>
      <span id="mainStatusText">检测中...</span>
    </div>
    <div id="mainInfo"></div>
    <div id="mainBedrockTip" style="margin-top:6px;color:#9ca3af;font-size:14px;">兼容基岩版登录</div>
    <button class="btn btn-primary" id="mainViewPlayerBtn">查看在线玩家</button>
  </div>

  <div class="card">
    <h3 id="smallServerTitle">小服 play.simpfun.cn:28381</h3>
    <div class="server-row">
      <span class="status-dot dot-gray" id="smallDot"></span>
      <span id="smallStatusText">检测中...</span>
    </div>
    <div id="smallInfo"></div>
    <div id="smallBedrockTip" style="margin-top:6px;color:#9ca3af;font-size:14px;">兼容基岩版登录</div>
    <button class="btn btn-primary" id="smallViewPlayerBtn">查看在线玩家</button>
  </div>

  <div class="modal-mask" id="playerModal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modalTitle">在线玩家</span>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="search-wrap">
          <input class="search-input" id="playerSearch" placeholder="搜索玩家名称">
          <button class="search-clear" id="searchClear">×</button>
        </div>
        <div id="modalTip"></div>
        <div class="player-grid" id="playerListWrap"></div>
        <div class="pagination" id="pageWrap"></div>
      </div>
    </div>
  </div>

  <div class="footer-text">
    <p>Powered by Cloudflare</p>
    <p>由zwx5817开发</p>
  </div>
</div>

<script>
const i18n = {
  zh:{
    title:"Tesseract MC服务器",
    intro:"欢迎来到Tesseract服务器，请加入QQ审核群进入服务器",
    hotTip:"热知识：服务器可以用矿透",
    ruleHead:"📜 服务器规则",
    ruleContent:[
      "禁止恶意破坏他人建筑、生电机器",
      "禁止恶意卡服、压测服务器",
      "禁止恶意骚扰其他玩家",
      "加入服务器需要通过QQ审核群审核"
    ],
    qqText:"戳我直达QQ审核群 ↗",
    mainServerTitle:"主服 hmfree.tooo.top:20049",
    smallServerTitle:"小服 play.simpfun.cn:28381",
    checking:"检测中...",
    online:"在线",
    offline:"离线",
    mainOfflineNote:"服务器可能正在被攻击",
    smallOfflineNote:"可能是服主没开机（也有可能被打了）",
    viewPlayer:"查看在线玩家",
    modalTitle:"在线玩家",
    searchPlaceholder:"搜索玩家名称",
    waitDetect:"请等待检测完成",
    onlyOnline:"仅服务器在线时可用",
    noPlayerList:"服务器已在线，但服务端未向外提供玩家名单",
    noFilterResult:"没有匹配玩家",
    prev:"上一页",
    next:"下一页",
    players:"玩家",
    version:"版本",
    max:"最大",
    bedrockTip:"兼容基岩版登录"
  },
  en:{
    title:"Tesseract MC Server",
    intro:"Welcome to Tesseract, join QQ review group to access server",
    hotTip:"Fun fact: X‑ray mods are allowed on server",
    ruleHead:"📜 Server Rules",
    ruleContent:[
      "Do not grief other players' builds or technical machines",
      "Do not lag‑bomb or stress‑test server",
      "Do not harass other players",
      "QQ group review is required before joining"
    ],
    qqText:"Jump to QQ review group ↗",
    mainServerTitle:"Main Server hmfree.tooo.top:20049",
    smallServerTitle:"Secondary Server play.simpfun.cn:28381",
    checking:"Checking...",
    online:"Online",
    offline:"Offline",
    mainOfflineNote:"Server may be under attack",
    smallOfflineNote:"Host may not start server (could also be attacked)",
    viewPlayer:"View online players",
    modalTitle:"Online Players",
    searchPlaceholder:"Search player name",
    waitDetect:"Please wait for detection complete",
    onlyOnline:"Only available when server is online",
    noPlayerList:"Server is online, but player list is not exposed by server",
    noFilterResult:"No matched players",
    prev:"Prev",
    next:"Next",
    players:"players",
    version:"Version",
    max:"Max",
    bedrockTip:"Bedrock Edition compatible"
  }
};

let currentLang = (navigator.language||"zh").startsWith("en")?"en":"zh";
let serverData = {
  main:{status:"loading",payload:null},
  small:{status:"loading",payload:null}
};
const PAGE_SIZE = 20;

function applyLang(){
  const t = i18n[currentLang];
  document.getElementById("toggleLang").innerText = currentLang==="zh"?"Switch to English":"切换中文";
  document.getElementById("title").innerText = t.title;
  document.getElementById("intro").innerText = t.intro;
  document.getElementById("hotTip").innerText = t.hotTip;
  document.getElementById("ruleHead").innerText = t.ruleHead;
  document.getElementById("qqBtn").innerText = t.qqText;
  document.getElementById("mainServerTitle").innerText = t.mainServerTitle;
  document.getElementById("smallServerTitle").innerText = t.smallServerTitle;
  document.getElementById("mainBedrockTip").innerText = t.bedrockTip;
  document.getElementById("smallBedrockTip").innerText = t.bedrockTip;
  document.getElementById("mainViewPlayerBtn").innerText = t.viewPlayer;
  document.getElementById("smallViewPlayerBtn").innerText = t.viewPlayer;
  document.getElementById("modalTitle").innerText = t.modalTitle;
  document.getElementById("playerSearch").placeholder = t.searchPlaceholder;

  const ruleWrap = document.getElementById("ruleContent");
  ruleWrap.innerHTML = "";
  t.ruleContent.forEach(txt=>{
    const li = document.createElement("li");
    li.innerText = txt;
    ruleWrap.appendChild(li);
  });

  renderServerUi();
}

document.getElementById("toggleLang").onclick = ()=>{
  currentLang = currentLang==="zh"?"en":"zh";
  applyLang();
};

function renderServerUi(){
  const t = i18n[currentLang];
  const m = serverData.main;
  const mainDot = document.getElementById("mainDot");
  const mainStatusText = document.getElementById("mainStatusText");
  const mainInfo = document.getElementById("mainInfo");
  if(m.status === "loading"){
    mainDot.className = "status-dot dot-gray";
    mainStatusText.innerText = t.checking;
    mainInfo.innerHTML = "";
  }else if(m.status === "online"){
    mainDot.className = "status-dot dot-green";
    mainStatusText.innerText = t.online;
    const pl = m.payload.players;
    const ver = m.payload.version?.name_clean||"-";
    mainInfo.innerHTML = `<div style="margin:4px 0;">${t.players}: ${pl.online}/${pl.max}｜${t.version}: ${ver}</div>`;
  }else{
    mainDot.className = "status-dot dot-red";
    mainStatusText.innerText = t.offline + "｜" + t.mainOfflineNote;
    mainInfo.innerHTML = "";
  }

  const s = serverData.small;
  const smallDot = document.getElementById("smallDot");
  const smallStatusText = document.getElementById("smallStatusText");
  const smallInfo = document.getElementById("smallInfo");
  if(s.status === "loading"){
    smallDot.className = "status-dot dot-gray";
    smallStatusText.innerText = t.checking;
    smallInfo.innerHTML = "";
  }else if(s.status === "online"){
    smallDot.className = "status-dot dot-green";
    smallStatusText.innerText = t.online;
    const pl = s.payload.players;
    const ver = s.payload.version?.name_clean||"-";
    smallInfo.innerHTML = `<div style="margin:4px 0;">${t.players}: ${pl.online}/${pl.max}｜${t.version}: ${ver}</div>`;
  }else{
    smallDot.className = "status-dot dot-red";
    smallStatusText.innerText = t.offline + "｜" + t.smallOfflineNote;
    smallInfo.innerHTML = "";
  }
}

async function fetchServer(host,port){
  const rnd = Date.now();
  const res = await fetch(`https://api.mcsrvstat.us/2/${host}:${port}?_=${rnd}`);
  return await res.json();
}

async function refreshAll(){
  serverData.main.status = "loading";
  serverData.small.status = "loading";
  renderServerUi();
  try{
    const mainJson = await fetchServer("hmfree.tooo.top",20049);
    if(mainJson.online){
      serverData.main = {status:"online",payload:mainJson};
    }else{
      serverData.main = {status:"offline",payload:null};
    }
  }catch(e){
    serverData.main = {status:"offline",payload:null};
  }

  try{
    const smallJson = await fetchServer("play.simpfun.cn",28381);
    if(smallJson.online){
      serverData.small = {status:"online",payload:smallJson};
    }else{
      serverData.small = {status:"offline",payload:null};
    }
  }catch(e){
    serverData.small = {status:"offline",payload:null};
  }
  renderServerUi();
}

const modal = document.getElementById("playerModal");
const modalClose = document.getElementById("modalClose");
const playerListWrap = document.getElementById("playerListWrap");
const pageWrap = document.getElementById("pageWrap");
const playerSearch = document.getElementById("playerSearch");
const searchClear = document.getElementById("searchClear");
const modalTip = document.getElementById("modalTip");

let modalSource = null;
let modalAllPlayers = [];
let modalCurPage = 1;

modalClose.onclick = ()=>{modal.style.display="none";};
modal.onclick = e=>{if(e.target===modal) modal.style.display="none";};
searchClear.onclick = ()=>{playerSearch.value="";renderPlayerModal();};
playerSearch.oninput = ()=>{modalCurPage=1;renderPlayerModal();};

document.getElementById("mainViewPlayerBtn").onclick = ()=>{
  const t = i18n[currentLang];
  if(serverData.main.status === "loading"){
    alert(t.waitDetect);
    return;
  }
  if(serverData.main.status !== "online"){
    alert(t.onlyOnline);
    return;
  }
  modalSource = "main";
  openPlayerModal(serverData.main.payload);
};

document.getElementById("smallViewPlayerBtn").onclick = ()=>{
  const t = i18n[currentLang];
  if(serverData.small.status === "loading"){
    alert(t.waitDetect);
    return;
  }
  if(serverData.small.status !== "online"){
    alert(t.onlyOnline);
    return;
  }
  modalSource = "small";
  openPlayerModal(serverData.small.payload);
};

function openPlayerModal(payload){
  const t = i18n[currentLang];
  modalCurPage = 1;
  playerSearch.value = "";
  modalTip.innerText = "";
  playerListWrap.innerHTML = "";
  pageWrap.innerHTML = "";

  let sample = payload.players?.list;
  if(!Array.isArray(sample)){
    modalTip.innerText = t.noPlayerList;
    modalAllPlayers = [];
  }else{
    modalAllPlayers = [...sample].sort((a,b)=>{
      const na = a.name_clean;
      const nb = b.name_clean;
      const aDot = na.startsWith(".");
      const bDot = nb.startsWith(".");
      if(aDot && !bDot) return 1;
      if(!aDot && bDot) return -1;
      return na.localeCompare(nb,"en");
    });
  }
  renderPlayerModal();
  modal.style.display = "flex";
}

function renderPlayerModal(){
  const t = i18n[currentLang];
  const kw = playerSearch.value.trim().toLowerCase();
  let filtered = modalAllPlayers;
  if(kw){
    filtered = modalAllPlayers.filter(p=>p.name_clean.toLowerCase().includes(kw));
  }
  const total = filtered.length;
  const totalPage = Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(modalCurPage>totalPage) modalCurPage = totalPage;
  const start = (modalCurPage-1)*PAGE_SIZE;
  const pageData = filtered.slice(start,start+PAGE_SIZE);

  playerListWrap.innerHTML = "";
  if(total===0 && modalAllPlayers.length>0){
    playerListWrap.innerHTML = `<div style="color:#aaa;">${t.noFilterResult}</div>`;
  }else{
    pageData.forEach(p=>{
      const div = document.createElement("div");
      div.className = "player-item";
      div.innerText = p.name_clean;
      playerListWrap.appendChild(div);
    });
  }

  pageWrap.innerHTML = "";
  if(totalPage>1){
    const prevBtn = document.createElement("button");
    prevBtn.innerText = t.prev;
    prevBtn.disabled = modalCurPage<=1;
    prevBtn.onclick = ()=>{modalCurPage--;renderPlayerModal();};
    const nextBtn = document.createElement("button");
    nextBtn.innerText = t.next;
    nextBtn.disabled = modalCurPage>=totalPage;
    nextBtn.onclick = ()=>{modalCurPage++;renderPlayerModal();};
    pageWrap.appendChild(prevBtn);
    pageWrap.appendChild(nextBtn);
  }
}

applyLang();
refreshAll();
</script>
</body>
</html>
